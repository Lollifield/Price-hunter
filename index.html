<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Price Hunter - Live Prices & Codes</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const RealPriceHunter = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [searching, setSearching] = useState(false);
            const [results, setResults] = useState([]);
            const [error, setError] = useState('');
            const [productImage, setProductImage] = useState('');
            const [savedCodes, setSavedCodes] = useState([]);
            const [showCodeManager, setShowCodeManager] = useState(false);
            const [newCode, setNewCode] = useState({ code: '', store: '', description: '' });
            const [uploadedImage, setUploadedImage] = useState(null);
            const [analyzingImage, setAnalyzingImage] = useState(false);
            const fileInputRef = useRef(null);

            const SERPAPI_KEY = '80bc00fa74d50a182b1cfb94bf1626abf66f3f08c0001ae65dd6bc86ba5f6a82';

            // Load saved codes from localStorage on mount
            useEffect(() => {
                const stored = localStorage.getItem('discountCodes');
                if (stored) {
                    setSavedCodes(JSON.parse(stored));
                }
            }, []);

            // Save codes to localStorage whenever they change
            const saveCodeToStorage = (codes) => {
                localStorage.setItem('discountCodes', JSON.stringify(codes));
                setSavedCodes(codes);
            };

            const addDiscountCode = () => {
                if (!newCode.code || !newCode.store) {
                    alert('Please enter both code and store name');
                    return;
                }

                const codeToAdd = {
                    ...newCode,
                    id: Date.now(),
                    dateAdded: new Date().toLocaleDateString()
                };

                const updatedCodes = [...savedCodes, codeToAdd];
                saveCodeToStorage(updatedCodes);
                setNewCode({ code: '', store: '', description: '' });
            };

            const deleteCode = (id) => {
                const updatedCodes = savedCodes.filter(c => c.id !== id);
                saveCodeToStorage(updatedCodes);
            };

            const getCodesForStore = (storeName) => {
                return savedCodes.filter(code => 
                    storeName.toLowerCase().includes(code.store.toLowerCase()) ||
                    code.store.toLowerCase().includes(storeName.toLowerCase())
                );
            };

            const copyCodeAndVisit = async (url, code = null) => {
                if (code) {
                    try {
                        await navigator.clipboard.writeText(code);
                        const notification = document.createElement('div');
                        notification.style.cssText = `
                            position: fixed;
                            top: 20px;
                            right: 20px;
                            background: #10b981;
                            color: white;
                            padding: 16px 24px;
                            border-radius: 8px;
                            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
                            z-index: 10000;
                            font-weight: 600;
                            animation: slideIn 0.3s ease-out;
                        `;
                        notification.textContent = `✓ Code "${code}" copied!`;
                        document.body.appendChild(notification);
                        
                        setTimeout(() => {
                            notification.style.animation = 'slideOut 0.3s ease-out';
                            setTimeout(() => notification.remove(), 300);
                        }, 3000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                    }
                }
                
                // Open link without referrer to bypass blocking
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUploadedImage(reader.result);
                        // Don't auto-analyze - let user describe what they see
                    };
                    reader.readAsDataURL(file);
                }
            };

            const analyzeImage = async (imageData) => {
                setAnalyzingImage(true);
                setError('');

                try {
                    // Convert base64 to blob
                    const base64Data = imageData.split(',')[1];
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'image/jpeg' });

                    // Upload image to a temporary hosting service first
                    // Since SerpAPI requires a URL, we'll use a simpler approach:
                    // Try to use Google's reverse image search directly
                    
                    const formData = new FormData();
                    formData.append('encoded_image', base64Data);
                    formData.append('image_url', '');
                    
                    // Alternative: Use SerpAPI Google Lens with inline image
                    const response = await fetch(
                        `https://serpapi.com/search.json?engine=google_lens&api_key=${SERPAPI_KEY}`,
                        {
                            method: 'POST',
                            body: formData
                        }
                    );

                    if (!response.ok) {
                        // Fallback: Try to extract text from image and search
                        throw new Error('Image upload not supported. Please search by product name instead.');
                    }

                    const data = await response.json();

                    // Extract product name from visual matches
                    let productName = '';
                    
                    if (data.visual_matches && data.visual_matches.length > 0) {
                        productName = data.visual_matches[0].title;
                    } else if (data.knowledge_graph && data.knowledge_graph.title) {
                        productName = data.knowledge_graph.title;
                    } else if (data.inline_images && data.inline_images.length > 0) {
                        productName = data.inline_images[0].title;
                    } else {
                        throw new Error('Could not identify product. Please try searching by name.');
                    }

                    setSearchQuery(productName);
                    searchProduct(productName);

                } catch (err) {
                    console.error('Image analysis error:', err);
                    setError('Image search requires a premium API plan. Please search by typing the product name instead.');
                    setAnalyzingImage(false);
                    setUploadedImage(null);
                }
            };

            const searchProduct = async (query) => {
                if (!query) {
                    setError('Please enter a product name');
                    return;
                }

                setSearching(true);
                setError('');
                setResults([]);

                try {
                    // Build the SerpAPI URL
                    const apiUrl = `https://serpapi.com/search.json?engine=google_shopping&q=${encodeURIComponent(query)}&location=Australia&gl=au&hl=en&api_key=${SERPAPI_KEY}`;
                    
                    // Try multiple CORS proxies in order
                    const proxies = [
                        `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
                        `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,
                        apiUrl // Try direct as last resort
                    ];
                    
                    let lastError = null;
                    
                    for (const proxyUrl of proxies) {
                        try {
                            const response = await fetch(proxyUrl);
                            
                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status}`);
                            }

                            const data = await response.json();

                            if (data.error) {
                                throw new Error(data.error);
                            }

                            if (data.shopping_results && data.shopping_results.length > 0) {
                                const formattedResults = data.shopping_results.slice(0, 10).map(item => ({
                                    title: item.title,
                                    price: item.extracted_price || item.price || 0,
                                    store: item.source || 'Unknown Store',
                                    url: item.link,
                                    image: item.thumbnail,
                                    rating: item.rating || null,
                                    reviews: item.reviews || 0,
                                    delivery: item.delivery || 'Standard shipping'
                                }));

                                formattedResults.sort((a, b) => a.price - b.price);
                                setResults(formattedResults);
                                
                                if (formattedResults[0]?.image) {
                                    setProductImage(formattedResults[0].image);
                                }
                                
                                setSearching(false);
                                return; // Success!
                            } else {
                                setError('No products found. Try: "iPhone 15 Pro", "Nike Air Max", or "Sony headphones"');
                                setSearching(false);
                                return;
                            }
                            
                        } catch (err) {
                            lastError = err;
                            // Continue to next proxy
                            continue;
                        }
                    }
                    
                    // If we got here, all proxies failed
                    throw lastError || new Error('All connection attempts failed');

                } catch (err) {
                    let errorMessage = err.message;
                    
                    if (errorMessage.includes('401') || errorMessage.includes('Invalid API key')) {
                        errorMessage = '🔑 Your API key is invalid. Go to serpapi.com/manage-api-key to check it.';
                    } else if (errorMessage.includes('429') || errorMessage.includes('limit')) {
                        errorMessage = '⏱️ Monthly limit reached (100 searches used). Upgrade at serpapi.com/pricing or wait until next month.';
                    } else {
                        errorMessage = `⚠️ Cannot connect to the price search service. This is a technical limitation - the app needs to be hosted on a server to work properly. The HTML file alone cannot bypass browser security restrictions.`;
                    }
                    
                    setError(errorMessage);
                }

                setSearching(false);
            };

            const handleSearch = () => {
                searchProduct(searchQuery);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-6 md:mb-8">
                            <h1 className="text-3xl md:text-4xl lg:text-5xl font-bold text-indigo-900 mb-2">
                                🔍 Real Price Hunter
                            </h1>
                            <p className="text-gray-600 text-sm md:text-lg">
                                Live prices from Google Shopping + Your Discount Codes
                            </p>
                            <div className="flex gap-4 justify-center mt-4">
                                <button
                                    onClick={() => setShowCodeManager(!showCodeManager)}
                                    className="px-3 md:px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-semibold text-sm md:text-base"
                                >
                                    🎟️ Manage Codes ({savedCodes.length})
                                </button>
                            </div>
                        </div>

                        {/* Code Manager Modal */}
                        {showCodeManager && (
                            <div className="bg-white rounded-2xl shadow-xl p-4 md:p-6 mb-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl md:text-2xl font-bold text-gray-800">💾 Your Discount Codes</h2>
                                    <button
                                        onClick={() => setShowCodeManager(false)}
                                        className="text-gray-500 hover:text-gray-700 text-xl md:text-2xl"
                                    >
                                        ✕
                                    </button>
                                </div>

                                {/* Add New Code Form */}
                                <div className="bg-indigo-50 rounded-lg p-3 md:p-4 mb-6">
                                    <h3 className="font-semibold text-gray-800 mb-3 text-sm md:text-base">Add New Code</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <input
                                            type="text"
                                            placeholder="Code (e.g., SAVE20)"
                                            value={newCode.code}
                                            onChange={(e) => setNewCode({...newCode, code: e.target.value.toUpperCase()})}
                                            className="px-3 py-2 border rounded-lg text-sm md:text-base"
                                        />
                                        <input
                                            type="text"
                                            placeholder="Store (e.g., Nike)"
                                            value={newCode.store}
                                            onChange={(e) => setNewCode({...newCode, store: e.target.value})}
                                            className="px-3 py-2 border rounded-lg text-sm md:text-base"
                                        />
                                        <input
                                            type="text"
                                            placeholder="Description (optional)"
                                            value={newCode.description}
                                            onChange={(e) => setNewCode({...newCode, description: e.target.value})}
                                            className="px-3 py-2 border rounded-lg text-sm md:text-base"
                                        />
                                    </div>
                                    <button
                                        onClick={addDiscountCode}
                                        className="mt-3 px-4 md:px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-sm md:text-base w-full md:w-auto"
                                    >
                                        + Add Code
                                    </button>
                                </div>

                                {/* Saved Codes List */}
                                <div className="space-y-3">
                                    {savedCodes.length === 0 ? (
                                        <p className="text-gray-500 text-center py-8">
                                            No codes saved yet. Add codes you find online to use them later!
                                        </p>
                                    ) : (
                                        savedCodes.map(code => (
                                            <div key={code.id} className="border rounded-lg p-4 flex justify-between items-start">
                                                <div>
                                                    <p className="font-mono font-bold text-lg text-indigo-600">{code.code}</p>
                                                    <p className="text-sm text-gray-600">Store: {code.store}</p>
                                                    {code.description && (
                                                        <p className="text-sm text-gray-500">{code.description}</p>
                                                    )}
                                                    <p className="text-xs text-gray-400 mt-1">Added: {code.dateAdded}</p>
                                                </div>
                                                <button
                                                    onClick={() => deleteCode(code.id)}
                                                    className="text-red-500 hover:text-red-700 font-bold"
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Search Section */}
                        <div className="bg-white rounded-2xl shadow-xl p-4 md:p-8 mb-6">
                            <div className="text-center">
                                <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-4">
                                    Search for any product
                                </h2>
                                
                                {/* Text Search */}
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder="e.g., Nike Vomero Plus Womens, iPhone 15 Pro..."
                                        className="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none text-base md:text-lg"
                                    />
                                    <button
                                        onClick={handleSearch}
                                        disabled={searching}
                                        className="px-6 md:px-8 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-gray-400 font-semibold text-base md:text-lg whitespace-nowrap"
                                    >
                                        {searching ? 'Searching...' : 'Search Prices'}
                                    </button>
                                </div>
                                
                                <div className="mt-4 flex flex-wrap gap-2 justify-center text-sm">
                                    <span className="text-gray-600">Try:</span>
                                    <button
                                        onClick={() => {
                                            setSearchQuery('Nike Vomero Plus Womens');
                                            searchProduct('Nike Vomero Plus Womens');
                                        }}
                                        className="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-full"
                                    >
                                        Nike Vomero
                                    </button>
                                    <button
                                        onClick={() => {
                                            setSearchQuery('iPhone 15 Pro');
                                            searchProduct('iPhone 15 Pro');
                                        }}
                                        className="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-full"
                                    >
                                        iPhone 15
                                    </button>
                                    <button
                                        onClick={() => {
                                            setSearchQuery('Sony WH-1000XM5');
                                            searchProduct('Sony WH-1000XM5');
                                        }}
                                        className="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-full"
                                    >
                                        Sony Headphones
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Loading State */}
                        {searching && (
                            <div className="bg-white rounded-2xl shadow-xl p-8 text-center">
                                <div className="animate-spin text-6xl mb-4">🔄</div>
                                <p className="text-xl font-semibold text-gray-700">
                                    Searching Google Shopping for real prices...
                                </p>
                                <p className="text-gray-500 mt-2">
                                    Finding the best deals across Australian retailers
                                </p>
                            </div>
                        )}

                        {/* Error State */}
                        {error && !searching && (
                            <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-6 text-center">
                                <p className="text-red-700 font-semibold text-lg">{error}</p>
                            </div>
                        )}

                        {/* Best Deal */}
                        {results.length > 0 && !searching && (
                            <div className="bg-gradient-to-r from-green-500 to-emerald-600 rounded-2xl shadow-2xl p-6 md:p-8 mb-6 text-white">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="text-4xl">🏆</span>
                                    <h2 className="text-2xl md:text-3xl font-bold">Lowest Price Found!</h2>
                                </div>
                                <div className="bg-white/20 rounded-xl p-6 backdrop-blur-sm">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div className="flex gap-4 items-center">
                                            {productImage && (
                                                <img src={productImage} alt="Product" className="w-20 h-20 object-contain bg-white rounded-lg p-2" />
                                            )}
                                            <div>
                                                <p className="text-lg font-semibold">{results[0].store}</p>
                                                <p className="text-3xl font-bold mt-2">
                                                    ${results[0].price.toFixed(2)}
                                                </p>
                                                {getCodesForStore(results[0].store).length > 0 && (
                                                    <p className="mt-2 bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full inline-block font-semibold text-sm">
                                                        🎟️ {getCodesForStore(results[0].store).length} code(s) available!
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => {
                                                const codes = getCodesForStore(results[0].store);
                                                copyCodeAndVisit(results[0].url, codes[0]?.code);
                                            }}
                                            className="bg-white text-green-600 px-8 py-3 rounded-lg font-bold hover:bg-green-50 transition-colors"
                                        >
                                            {getCodesForStore(results[0].store).length > 0 ? 'Copy Code & Shop' : 'Shop Now'} →
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Results */}
                        {results.length > 0 && !searching && (
                            <>
                                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                                    <h3 className="text-2xl font-bold text-gray-800 mb-2">
                                        📦 {searchQuery}
                                    </h3>
                                    <p className="text-gray-600">
                                        Found {results.length} stores
                                    </p>
                                </div>

                                <div className="bg-white rounded-2xl shadow-xl p-6">
                                    <h3 className="text-2xl font-bold text-gray-800 mb-4">
                                        💰 Live Price Comparison
                                    </h3>
                                    
                                    <div className="space-y-4">
                                        {results.map((result, index) => {
                                            const storeCodes = getCodesForStore(result.store);
                                            
                                            return (
                                                <div
                                                    key={index}
                                                    className={`border-2 rounded-lg p-4 hover:shadow-md transition-shadow ${
                                                        index === 0 ? 'border-green-500 bg-green-50' : 'border-gray-200'
                                                    }`}
                                                >
                                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                        <div className="flex gap-4 items-start flex-1">
                                                            {result.image && (
                                                                <img 
                                                                    src={result.image} 
                                                                    alt={result.title} 
                                                                    className="w-16 h-16 object-contain bg-gray-50 rounded p-1"
                                                                />
                                                            )}
                                                            <div className="flex-1">
                                                                <div className="flex items-center gap-2 mb-2">
                                                                    <h4 className="text-lg font-bold text-gray-800">
                                                                        {result.store}
                                                                    </h4>
                                                                    {index === 0 && (
                                                                        <span className="bg-green-500 text-white px-2 py-1 rounded text-xs font-semibold">
                                                                            BEST PRICE
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                
                                                                <p className="text-sm text-gray-600 mb-2 line-clamp-2">
                                                                    {result.title}
                                                                </p>
                                                                
                                                                <div className="flex items-baseline gap-2 mb-2">
                                                                    <span className="text-2xl font-bold text-indigo-600">
                                                                        ${result.price.toFixed(2)}
                                                                    </span>
                                                                </div>

                                                                {storeCodes.length > 0 && (
                                                                    <div className="mb-2">
                                                                        <p className="text-sm font-semibold text-green-600">
                                                                            💰 Your saved codes:
                                                                        </p>
                                                                        {storeCodes.map(code => (
                                                                            <div key={code.id} className="text-xs bg-yellow-100 border border-yellow-300 rounded px-2 py-1 mt-1 inline-block mr-2">
                                                                                <span className="font-mono font-bold">{code.code}</span>
                                                                                {code.description && <span className="text-gray-600"> - {code.description}</span>}
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                                
                                                                <div className="flex flex-wrap gap-3 text-sm text-gray-600">
                                                                    <span>🚚 {result.delivery}</span>
                                                                    {result.rating && (
                                                                        <span>⭐ {result.rating} ({result.reviews} reviews)</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        <button
                                                            onClick={() => copyCodeAndVisit(result.url, storeCodes[0]?.code)}
                                                            className="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold whitespace-nowrap"
                                                        >
                                                            {storeCodes.length > 0 ? 'Copy Code & Visit' : 'Visit Store'} →
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* Info */}
                        {!searching && results.length === 0 && !error && (
                            <div className="bg-white rounded-2xl shadow-xl p-6">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">✨ How it works</h3>
                                <div className="grid md:grid-cols-3 gap-6">
                                    <div>
                                        <div className="text-4xl mb-2">🔍</div>
                                        <h4 className="font-semibold text-gray-800 mb-2">1. Search Product</h4>
                                        <p className="text-sm text-gray-600">
                                            Type any product name to search
                                        </p>
                                    </div>
                                    <div>
                                        <div className="text-4xl mb-2">💰</div>
                                        <h4 className="font-semibold text-gray-800 mb-2">2. Compare Prices</h4>
                                        <p className="text-sm text-gray-600">
                                            See real-time prices from Australian retailers
                                        </p>
                                    </div>
                                    <div>
                                        <div className="text-4xl mb-2">🎟️</div>
                                        <h4 className="font-semibold text-gray-800 mb-2">3. Use Your Codes</h4>
                                        <p className="text-sm text-gray-600">
                                            Save codes you find and we'll show them automatically
                                        </p>
                                    </div>
                                </div>
                                <div className="mt-6 p-4 bg-blue-50 rounded-lg text-sm">
                                    <p className="text-gray-700">
                                        <strong>💡 Tip:</strong> Click "Manage Codes" to add discount codes you find online (from emails, RetailMeNot, etc.)
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<RealPriceHunter />, document.getElementById('root'));
    </script>
</body>
</html>
